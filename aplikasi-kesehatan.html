<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SehatLab – Konsultasi & Hasil Laboratorium</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14302f;--mute:#5d7471;--line:#dbe4e2;--brand:#0d6b63;--brand-ink:#fff;--soft:#e2f1ee;--ok:#1d7a46;--okbg:#e1f3e8;--hi:#b3261e;--hibg:#fbe4e1;--lo:#8a5a00;--lobg:#fdf0d3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--card:#162826;--ink:#e6f0ee;--mute:#93aca8;--line:#264240;--brand:#4cc2b5;--brand-ink:#08201d;--soft:#1b3835;--ok:#6fd49a;--okbg:#17382a;--hi:#ff9d94;--hibg:#412020;--lo:#f0c15c;--lobg:#3b2f12}}
:root[data-theme="dark"]{--bg:#0e1b1a;--card:#162826;--ink:#e6f0ee;--mute:#93aca8;--line:#264240;--brand:#4cc2b5;--brand-ink:#08201d;--soft:#1b3835;--ok:#6fd49a;--okbg:#17382a;--hi:#ff9d94;--hibg:#412020;--lo:#f0c15c;--lobg:#3b2f12}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
:root{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
main{flex:1;padding:20px 18px 96px}
h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;margin-bottom:10px}
h3{font-size:16px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;width:100%}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:transparent;color:var(--hi);border:1.5px solid var(--hi)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:130px;resize:vertical}
.err{color:var(--hi);font-size:14px;margin-top:6px;min-height:20px}
.back{background:none;border:0;color:var(--brand);font-weight:700;padding:8px 0;margin-bottom:6px;min-height:44px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute)}
nav button[aria-current="page"]{color:var(--brand)}
nav svg{width:24px;height:24px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;display:flex;flex-direction:column;gap:8px;min-height:116px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.tile svg{width:22px;height:22px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:800}
.row.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.hi{background:var(--hibg);color:var(--hi)}.chip.lo{background:var(--lobg);color:var(--lo)}.chip.n{background:var(--soft);color:var(--brand)}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:20px;margin-bottom:18px}
.hero p{opacity:.9;font-size:14px}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--brand)}
.res{padding:12px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.val{font-weight:800;font-size:20px}
.val small{font-weight:500;font-size:13px;color:var(--mute)}
.bar{position:relative;height:8px;border-radius:9px;margin:10px 0 4px;background:linear-gradient(90deg,var(--lobg) 0 25%,var(--okbg) 25% 75%,var(--hibg) 75% 100%)}
.bar b{position:absolute;top:-4px;width:6px;height:16px;border-radius:3px;background:var(--ink);transform:translateX(-50%);border:2px solid var(--card)}
.bubble{padding:10px 13px;border-radius:14px;max-width:88%;font-size:15px}
.bubble.me{background:var(--brand);color:var(--brand-ink);margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.art p{margin-top:12px}
.art ul{margin:10px 0 0 20px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:9}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);margin-top:16px}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .2s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
.m3{grid-template-columns:repeat(3,1fr)}.m3 .tile{align-items:center;text-align:center;min-height:98px;padding:10px 4px;gap:6px;font-size:13px;line-height:1.25}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin:14px 0}.seg button{border:0;background:transparent;min-height:42px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--card);color:var(--brand)}
.sm{width:auto;min-height:40px;padding:0 14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const I={
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
 lab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>',
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const NAKES=[
 {id:1,n:'dr. Ayu Pratiwi',r:'Dokter Umum',h:'Senin–Sabtu, 08.00–16.00',on:true},
 {id:2,n:'dr. Bagus Wirawan, Sp.PD',r:'Spesialis Penyakit Dalam',h:'Selasa & Kamis, 13.00–18.00',on:true},
 {id:3,n:'Ni Made Sari, A.Md.AK',r:'Analis Kesehatan (Laboratorium)',h:'Senin–Jumat, 07.30–15.00',on:true},
 {id:4,n:'Rina Kusuma, S.Gz',r:'Ahli Gizi',h:'Rabu & Jumat, 09.00–14.00',on:false},
 {id:5,n:'Bd. Lestari, S.Tr.Keb',r:'Bidan',h:'Senin–Sabtu, 09.00–17.00',on:true}
];
const LAB=[
 {id:'a',t:'Hematologi Rutin',d:'12 Okt 2026',f:'Puasa tidak diperlukan',items:[
  ['Hemoglobin',13.8,'g/dL',12,16],['Leukosit',11.9,'×10³/µL',4,10],['Trombosit',265,'×10³/µL',150,400],['Hematokrit',41,'%',36,46],['Eritrosit',4.7,'×10⁶/µL',4,5.5]]},
 {id:'b',t:'Kimia Klinik',d:'12 Okt 2026',f:'Puasa 10 jam',items:[
  ['Glukosa puasa',108,'mg/dL',70,100],['Kolesterol total',187,'mg/dL',0,200],['SGPT (ALT)',24,'U/L',0,35],['Ureum',28,'mg/dL',15,40],['Kreatinin',0.7,'mg/dL',0.6,1.1]]},
 {id:'c',t:'Urinalisis',d:'28 Sep 2026',f:'Urine pancar tengah',items:[
  ['pH urine',6,'',4.5,8],['Berat jenis',1.045,'',1.005,1.03],['Leukosit sedimen',3,'/LPB',0,5]]}
];
const EDU=[
 {id:1,t:'Persiapan sebelum tes darah',c:'Prosedur',m:'3 menit',b:['Sebagian pemeriksaan butuh puasa, misalnya glukosa dan profil lipid. Ikuti instruksi pada surat pengantar.','Selama puasa, air putih tetap boleh diminum.','Beri tahu petugas jika Anda sedang minum obat atau suplemen.'],l:['Puasa 8–12 jam untuk glukosa puasa dan lipid','Tidak perlu puasa untuk hematologi rutin','Tekan bekas tusukan 2–3 menit setelah pengambilan darah']},
 {id:2,t:'Membaca hasil hematologi',c:'Hasil lab',m:'4 menit',b:['Hemoglobin yang rendah menandakan kemungkinan anemia, sedangkan leukosit yang tinggi sering muncul saat ada infeksi.','Nilai rujukan dapat berbeda antar laboratorium, usia, dan jenis kelamin. Hasil di luar rujukan bukan diagnosis, jadi konsultasikan dengan tenaga kesehatan.'],l:['Hb: oksigen dalam darah','Leukosit: sel pertahanan tubuh','Trombosit: pembekuan darah']},
 {id:3,t:'Mengenali gejala demam berdarah',c:'Penyakit',m:'3 menit',b:['Demam tinggi mendadak selama 2–7 hari dapat disertai nyeri kepala, nyeri belakang mata, dan nyeri otot.','Pemeriksaan trombosit dan hematokrit membantu memantau perjalanan penyakit.'],l:['Segera ke fasilitas kesehatan bila ada muntah terus-menerus','Waspada nyeri perut hebat dan perdarahan','Perbanyak minum selama demam']},
 {id:4,t:'Cuci tangan yang benar',c:'Pencegahan',m:'2 menit',b:['Cuci tangan dengan sabun dan air mengalir selama sedikitnya 20 detik. Ini menurunkan risiko penyakit diare dan infeksi saluran napas.'],l:['Basahi tangan, beri sabun','Gosok telapak, punggung tangan, sela jari, dan kuku','Bilas dan keringkan dengan kain bersih']}
];
const DEF={name:'Itha Rahmawati',email:'',phone:'0812-3456-7890',dob:'2003-05-14',blood:'O',gender:'Perempuan'};
const S={user:null,tab:'home',view:null,step:0,pick:null,cons:[],prof:{...DEF},toast:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>n.replace(/^(dr\.|Bd\.)\s*/,'').split(' ').slice(0,2).map(w=>w[0]).join('');
function save(){try{localStorage.setItem('sehatlab',JSON.stringify({user:S.user,cons:S.cons,prof:S.prof}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('sehatlab')||'null');if(d){S.user=d.user;S.cons=d.cons||[];S.prof={...DEF,...d.prof}}}catch(e){}}
function go(tab,view){S.tab=tab;S.view=view||null;if(tab==='konsul'&&!view){S.step=0;S.pick=null}render();scrollTo(0,0)}
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}
function flag(v,lo,hi){return v<lo?'lo':v>hi?'hi':'ok'}
const FL={lo:'Rendah',hi:'Tinggi',ok:'Normal'};
function rangeBar(v,lo,hi){const span=hi-lo||1;let p=25+((v-lo)/span)*50;p=Math.max(3,Math.min(97,p));return `<div class="bar" aria-hidden="true"><b style="left:${p}%"></b></div>`}

function loginView(){return `<div class="login"><div class="logo">${I.lab.replace('<svg','<svg width="30" height="30"')}</div>
<h1>Masuk ke SehatLab</h1><p class="mute" style="margin-top:6px">Konsultasi dengan tenaga kesehatan dan lihat hasil laboratorium Anda.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="nama@email.com">
<label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
<div class="err" id="er" role="alert"></div>
<button class="btn" id="go">Masuk</button>
<p class="note">Versi demo: isi email dan kata sandi apa saja (minimal 6 karakter) untuk masuk. Semua data hanya contoh.</p></div>`}

function homeView(){const p=S.prof;return `<div class="hero"><p>Selamat datang,</p><h1>${esc(p.name.split(' ')[0])}</h1><p style="margin-top:6px">Ada ${LAB.length} hasil laboratorium dan ${S.cons.length} konsultasi tercatat.</p></div>
<h2>Layanan</h2><div class="menu">
<button class="tile" data-go="konsul"><span class="ic">${I.chat}</span><b>Konsultasi</b><span class="mute">Tanya tenaga kesehatan</span></button>
<button class="tile" data-go="lab"><span class="ic">${I.lab}</span><b>Hasil Laboratorium</b><span class="mute">Lihat hasil pemeriksaan</span></button>
<button class="tile" data-go="edu"><span class="ic">${I.book}</span><b>Edukasi</b><span class="mute">Informasi kesehatan</span></button>
<button class="tile" data-go="profil"><span class="ic">${I.user}</span><b>Profil</b><span class="mute">Data diri Anda</span></button></div>
<h2 style="margin-top:22px">Hasil terbaru</h2>
<button class="row" data-lab="a"><div class="grow"><h3>${LAB[0].t}</h3><div class="mute">${LAB[0].d}</div></div><span class="chip hi">1 di luar rujukan</span></button>`}

function konsulView(){
 const dots=`<div class="steps" aria-hidden="true"><i class="on"></i><i class="${S.step>0?'on':''}"></i><i class="${S.step>1?'on':''}"></i></div>`;
 if(S.step===0){const hist=S.cons.length?`<h2 style="margin-top:24px">Riwayat konsultasi</h2><div class="stack">${S.cons.map((c,i)=>`<button class="row" data-th="${i}"><div class="grow"><h3>${esc(c.nk)}</h3><div class="mute">${esc(c.tgl)} · ${esc(c.keluhan.slice(0,40))}${c.keluhan.length>40?'…':''}</div></div><span class="chip n">${c.reply?'Dibalas':'Menunggu'}</span></button>`).join('')}</div>`:'';
 return `<h1>Konsultasi</h1><p class="mute" style="margin:4px 0 14px">Pilih tenaga kesehatan.</p>${dots}<div class="stack">${NAKES.map(n=>`<button class="row" data-nk="${n.id}" ${n.on?'':'aria-disabled="true" style="opacity:.55"'}><div class="avatar">${esc(ini(n.n))}</div><div class="grow"><h3>${esc(n.n)}</h3><div class="mute">${esc(n.r)}</div><div class="mute">${esc(n.h)}</div></div><span class="chip ${n.on?'ok':'n'}">${n.on?'Tersedia':'Offline'}</span></button>`).join('')}</div>${hist}`}
 if(S.step===1){const n=S.pick;return `<button class="back" id="bk">‹ Ganti tenaga kesehatan</button><h1>Kirim keluhan</h1>${dots}
 <div class="row" style="margin:10px 0"><div class="avatar">${esc(ini(n.n))}</div><div class="grow"><h3>${esc(n.n)}</h3><div class="mute">${esc(n.r)}</div></div></div>
 <label for="kl">Keluhan Anda</label><textarea id="kl" placeholder="Contoh: demam sejak 3 hari, disertai pusing dan mual."></textarea>
 <label for="du">Sudah berapa lama?</label><select id="du"><option>Kurang dari 1 hari</option><option>1–3 hari</option><option>4–7 hari</option><option>Lebih dari 1 minggu</option></select>
 <label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="ls" style="width:22px;min-height:22px"> Sertakan hasil laboratorium terbaru</label>
 <div class="err" id="er" role="alert"></div><button class="btn" id="kirim">Kirim keluhan</button>`}
 const c=S.cons[S.cons.length-1];return threadView(c,true)}

function threadView(c,fresh){return `<button class="back" id="bk2">‹ ${fresh?'Selesai':'Kembali'}</button><h1>${fresh?'Keluhan terkirim':'Percakapan'}</h1>
<p class="mute" style="margin:4px 0 14px">${esc(c.nk)} · ${esc(c.role)}</p><div class="stack">
<div class="bubble me">${esc(c.keluhan)}<div style="font-size:12px;opacity:.8;margin-top:4px">Durasi: ${esc(c.du)}${c.ls?' · Hasil lab dilampirkan':''}</div></div>
${c.reply?`<div class="bubble them">${esc(c.reply)}</div>`:`<div class="bubble them mute">Menunggu balasan…</div>`}</div>
<p class="note">Konsultasi ini tidak menggantikan pemeriksaan langsung. Jika kondisi darurat, segera ke IGD terdekat.</p>`}

function labView(){
 if(S.view){const e=LAB.find(x=>x.id===S.view);const abn=e.items.filter(i=>flag(i[1],i[3],i[4])!=='ok').length;
 return `<button class="back" id="bk">‹ Semua hasil</button><h1>${e.t}</h1><p class="mute">${e.d} · ${e.f}</p>
 <div class="card" style="margin-top:14px">${e.items.map(i=>{const f=flag(i[1],i[3],i[4]);return `<div class="res"><div class="rhead"><span>${i[0]}</span><span class="chip ${f}">${FL[f]}</span></div><div class="val">${i[1]} <small>${i[2]}</small></div>${rangeBar(i[1],i[3],i[4])}<div class="mute">Rujukan: ${i[3]===0?'≤ '+i[4]:i[3]+' – '+i[4]} ${i[2]}</div></div>`}).join('')}</div>
 <p class="note">${abn?abn+' nilai di luar rujukan. ':''}Hasil perlu ditafsirkan bersama gejala klinis. Tanyakan ke tenaga kesehatan sebelum mengambil keputusan.</p>
 <div style="margin-top:14px"><button class="btn ghost" data-go="konsul">Konsultasikan hasil ini</button></div>`}
 return `<h1>Hasil Laboratorium</h1><p class="mute" style="margin:4px 0 14px">Pilih pemeriksaan untuk melihat detail.</p><div class="stack">${LAB.map(e=>{const a=e.items.filter(i=>flag(i[1],i[3],i[4])!=='ok').length;return `<button class="row" data-lab="${e.id}"><div class="grow"><h3>${e.t}</h3><div class="mute">${e.d} · ${e.items.length} parameter</div></div><span class="chip ${a?'hi':'ok'}">${a?a+' perlu perhatian':'Normal'}</span></button>`}).join('')}</div>`}

function eduView(){
 if(S.view){const a=EDU.find(x=>x.id===S.view);return `<button class="back" id="bk">‹ Semua artikel</button><div class="art"><span class="chip n">${a.c}</span><h1 style="margin-top:8px">${a.t}</h1><p class="mute">${a.m} baca</p>${a.b.map(p=>`<p>${p}</p>`).join('')}<ul>${a.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
 return `<h1>Edukasi</h1><p class="mute" style="margin:4px 0 14px">Informasi kesehatan yang mudah dipahami.</p><div class="stack">${EDU.map(a=>`<button class="row" data-ed="${a.id}"><div class="grow"><h3>${a.t}</h3><div class="mute">${a.c} · ${a.m}</div></div></button>`).join('')}</div>`}

function profilView(){const p=S.prof;const B=['A','B','AB','O'];return `<h1>Profil</h1><div class="row" style="margin:14px 0"><div class="avatar">${esc(ini(p.name))}</div><div class="grow"><h3>${esc(p.name)}</h3><div class="mute">${esc(S.user)}</div></div></div>
<label for="pn">Nama lengkap</label><input id="pn" value="${esc(p.name)}" autocomplete="name">
<label for="pp">Nomor telepon</label><input id="pp" type="tel" value="${esc(p.phone)}">
<label for="pd">Tanggal lahir</label><input id="pd" type="date" value="${esc(p.dob)}">
<label for="pg">Jenis kelamin</label><select id="pg">${['Perempuan','Laki-laki'].map(g=>`<option ${p.gender===g?'selected':''}>${g}</option>`).join('')}</select>
<label for="pb">Golongan darah</label><select id="pb">${B.map(b=>`<option ${p.blood===b?'selected':''}>${b}</option>`).join('')}</select>
<div class="err" id="er" role="alert"></div>

  $('#pgo').onclick=()=>{const s=sel(),dt=$('#pt').value;if(!s.length){er('Pilih minimal satu pemeriksaan.');return}if(!dt||dt<today()){er('Pilih tanggal pemeriksaan mulai hari ini.');return}
   const t=s.reduce((a,i)=>a+EXAM[i][2],0);fin('Jadwal pemeriksaan dibuat','PMR',[['Pemeriksaan',s.map(i=>EXAM[i][0]).join(', ')],['Jadwal',fdate(dt)],['Total biaya',money(t)],['Catatan','Datang 15 menit lebih awal']],'Pemeriksaan lab/radiologi',t)}}
 if(v==='mcu')$('#mgo').onclick=()=>{const dt=$('#mt').value;if(!dt||dt<today()){er('Pilih tanggal MCU mulai hari ini.');return}const m=MCU[+document.querySelector('[name=mp]:checked').value];fin('Paket MCU dipesan','MCU',[['Paket','MCU '+m[0]],['Jadwal',fdate(dt)+', 07.30'],['Total biaya',money(m[1])],['Persiapan','Puasa 10–12 jam sebelum pemeriksaan']],'Medical Check Up '+m[0],m[1])};
 if(v==='rs'){document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{S.rs=b.dataset.rs;render()});const q=$('#qs');if(q)q.oninput=()=>{$('#rl').innerHTML=rsList(q.value.trim())}}
 if(v==='vc'){document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=()=>{S.call={d:SPES[+b.dataset.vc],t:0};render()});
  if(S.call){const c=S.call,fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');clearInterval(S.tmr);S.tmr=setInterval(()=>{c.t++;const e=$('#tm');if(e)e.textContent=fmt(c.t)},1000);
   const tg=(id,l)=>{let on=true;$('#'+id).onclick=e=>{on=!on;e.target.textContent=l+(on?' aktif':' mati')}};tg('cm','Mikrofon');tg('cv','Kamera');
   $('#cend').onclick=()=>{clearInterval(S.tmr);S.call=null;fin('Panggilan selesai','VC',[['Dokter',c.d[0]],['Durasi',fmt(c.t)],['Biaya sesi',money(c.d[2])]],'Video call '+c.d[0],c.d[2])}}}
 if(v==='va'){document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{try{navigator.clipboard.writeText(b.dataset.cp).then(()=>toast('Nomor VA disalin'),()=>toast('Salin nomor VA secara manual'))}catch(e){toast('Salin nomor VA secara manual')}});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{S.bills.find(x=>x.id===b.dataset.pay).paid=true;toast('Pembayaran tercatat lunas')})}
 if(v==='shop'){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=b.dataset.q,q=(S.cart[i]||0)+ +b.dataset.d;if(q>0)S.cart[i]=q;else delete S.cart[i];render()});
  const c=$('#chk');if(c)c.onclick=()=>{const it=Object.entries(S.cart),t=it.reduce((a,[i,q])=>a+PROD[i][1]*q,0),nm=it.map(([i,q])=>PROD[i][0]+' ×'+q).join(', ');S.cart={};fin('Pesanan dibuat','ORD',[['Barang',nm],['Total',money(t)],['Pengiriman','Estimasi 1–2 hari']],'Pesanan e-commerce',t)}}
}
load();render();
</script>
</body>
</html>
